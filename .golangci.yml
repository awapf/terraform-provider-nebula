version: "2"

linters:
  enable:
    - copyloopvar
    - durationcheck
    - errorlint
    - gosec
    - misspell
    - nilerr
    - predeclared
    - unconvert
    - unparam
    - usetesting
  settings:
    gosec:
      excludes:
        - G304 # ca_cert_file is a user-supplied path by design
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
